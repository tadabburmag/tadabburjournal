name: "🐞 مشكلة تقنية"
description: "الإبلاغ عن مشكلة قابلة لإعادة الظهور"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        شكرًا لمساعدتنا في تحسين مجلة تدبر. لا تضع كلمات مرور أو مفاتيح أو بيانات شخصية حساسة.
  - type: textarea
    id: problem
    attributes:
      label: "وصف المشكلة"
      description: "ما الذي حدث؟"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "السلوك المتوقع"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "خطوات إعادة المشكلة"
      placeholder: "1. افتح...
2. اضغط...
3. لاحظ..."
  - type: input
    id: page
    attributes:
      label: "الصفحة أو الرابط المتأثر"
  - type: input
    id: environment
    attributes:
      label: "الجهاز / المتصفح"
  - type: textarea
    id: extra
    attributes:
      label: "معلومات إضافية"
